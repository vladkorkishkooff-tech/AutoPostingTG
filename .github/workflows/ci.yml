name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: autoposting_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d autoposting_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/autoposting_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python dependencies
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q main.py bridge.py config.py db.py migrate.py scheduler.py setup_commands.py ai_gen.py ai_image.py image_fetcher.py user_keys.py content_history.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Apply database migrations twice
        run: python migrate.py && python migrate.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck Mini App
        run: pnpm typecheck
      - name: Lint Mini App
        run: pnpm lint
      - name: Run Mini App tests
        run: pnpm test:web
      - name: Build Mini App
        run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Build and validate bot image
        run: |
          docker build --pull -f Dockerfile.bot -t autoposting-bot:ci .
          docker run --rm --entrypoint python autoposting-bot:ci -m pip check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
