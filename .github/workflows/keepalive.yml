name: Render KeepAlive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          echo "Sending keepalive ping to Render..."
          curl -fsSL --retry 3 --retry-delay 5 --max-time 30 https://autopostingtg.onrender.com/health || echo "Ping attempt completed"
